name: Prepare Accelerate upstream attribution

on:
  push:
    branches: [didas/accelerate-upstream-attribution]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update provenance and licensing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "danielsaeuberli"
          git config user.email "danielsaeuberli@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('LICENSE')
          s = p.read_text().replace('Copyright (c) 2026 DIDAS', 'Copyright (c) 2026 Accelerate GmbH')
          p.write_text(s)

          readme = Path('README.md')
          s = readme.read_text()
          marker = '# Digital Health on the swiyu Trust Infrastructure\n'
          block = '''# Digital Health on the swiyu Trust Infrastructure\n\n> **Origin and attribution**  \n> Developed and contributed by **Accelerate GmbH** and published by DIDAS as an open-source ecosystem contribution.  \n> Canonical upstream: https://github.com/Accelerate-GmbH/digital-health-swiyu-vaccination  \n> DIDAS publication: https://github.com/DIDAS-swiss/digital-health_swiyu\n'''
          if marker in s and 'Canonical upstream: https://github.com/Accelerate-GmbH/digital-health-swiyu-vaccination' not in s:
              s = s.replace(marker, block, 1)
          s = s.replace('The implementation in this repository was written and contributed by\n[accelerate.swiss](https://www.accelerate.swiss/).',
                        'The original implementation in this repository was developed and contributed by\n[Accelerate GmbH](https://www.accelerate.swiss/).')
          s = s.replace('## Licence\n\nMIT. See [LICENSE](LICENSE).',
                        '## Licence\n\nSoftware is licensed under the MIT License; see [LICENSE](LICENSE). Documentation, flow specifications, diagrams, governance material and other original repository content are licensed under Creative Commons Attribution 4.0 International; see [LICENSE-CONTENT](LICENSE-CONTENT). Third-party materials remain subject to their respective terms; see [NOTICE.md](NOTICE.md).')
          readme.write_text(s)

          Path('LICENSE-CONTENT').write_text('''Creative Commons Attribution 4.0 International (CC BY 4.0)\n\nThis license applies to the original CONTENT of this repository, including documentation under docs/, flow specifications and diagrams under flows/, the showcase material under site/, generated credential documentation, governance models and explanatory prose, except where third-party rights or notices state otherwise.\n\nAttribution: "Digital Health on the swiyu Trust Infrastructure, Accelerate GmbH, contributed to DIDAS, https://github.com/Accelerate-GmbH/digital-health-swiyu-vaccination"\n\nThe software components of this repository are licensed under the MIT License; see LICENSE. Third-party standards, specifications, terminology and contributed materials remain subject to their respective rights and terms; see NOTICE.md.\n\nCanonical license text: https://creativecommons.org/licenses/by/4.0/legalcode\n''')

          Path('NOTICE.md').write_text('''# Origin and third-party notices\n\nThe original work and implementation in this repository are © 2026 Accelerate GmbH and were contributed to the DIDAS ecosystem.\n\nCanonical upstream: https://github.com/Accelerate-GmbH/digital-health-swiyu-vaccination\nDIDAS publication: https://github.com/DIDAS-swiss/digital-health_swiyu\n\nThis repository builds on and references third-party standards, specifications, terminology, software components and prior project contributions, including the Swiss swiyu specifications and Trust Protocol, OpenID specifications, SD-JWT / SD-JWT VC, HL7 FHIR, openEHR and work originating in Swiss GovTech Hackathons. Those materials remain subject to their respective rights, licences and terms. Nothing in LICENSE or LICENSE-CONTENT grants rights in third-party material beyond the rights Accelerate GmbH is entitled to grant.\n''')
          PY
          rm .github/workflows/accelerate-attribution.yml
          git add -A
          git commit -m "Attribute upstream work to Accelerate GmbH"
          git push origin HEAD:didas/accelerate-upstream-attribution
